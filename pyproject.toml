[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-memo"
version = "0.1.0"
description = "Zero-dependency Python pub/sub event bus with topic globs, async, DLQ, batching & history."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Hussain AlSaibai", email = "hussain.alsaibai@gmail.com" }]
keywords = ["pubsub", "event-bus", "event-driven", "publish-subscribe", "asyncio", "zero-dependency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-memo"
Repository = "https://github.com/hussain-alsaibai/tiny-memo"
Issues = "https://github.com/hussain-alsaibai/tiny-memo/issues"

[tool.setuptools]
py-modules = ["tiny_memo"]

[tool.pytest.ini_options]
testpaths = ["test_tiny_memo.py"]
addopts = "-v --tb=short"
